# mypy on the package format code that the Blender add-on bundles (docs/CODE-STYLE.md). scripts/test.sh runs it.
[mypy]
python_version = 3.11
files = pipeline/gh3/formats.py, pipeline/package/glb.py, pipeline/package/texture.py, pipeline/package/q48.py,
    pipeline/package/rotations.py, pipeline/package/container.py, pipeline/package/decisions.py,
    pipeline/package/checks.py, pipeline/package/profiles.py, pipeline/package/source.py, pipeline/package/schema.py
follow_imports = silent
ignore_missing_imports = True
warn_unused_ignores = True
